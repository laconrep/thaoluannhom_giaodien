<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ảnh tour hướng dẫn</title>
<style>
  body { font-family: ui-sans-serif, system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: #94a3b8; font-size: 14px; margin: 0 0 24px; }
  .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 24px; border: 1px solid #334155; }
  .card h2 { font-size: 15px; margin: 0 0 12px; color: #93c5fd; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
  figure { margin: 0; }
  img { width: 100%; border-radius: 8px; border: 1px solid #334155; display: block; }
  figcaption { font-size: 12px; color: #94a3b8; margin-top: 6px; text-align: center; }
</style>
</head>
<body>
  <h1>Ảnh tour hướng dẫn giáo viên</h1>
  <p class="sub">Bản demo mô phỏng giao diện app, nội dung và style đúng với tour đang triển khai.</p>

  <div class="card">
    <h2>Tour Dashboard (3 bước)</h2>
    <div class="grid">
      <figure><img src="tour-1-dashboard-step1.png" alt="Bước 1" /><figcaption>1. Chào mừng — spotlight tiêu đề</figcaption></figure>
      <figure><img src="tour-1-dashboard-step2.png" alt="Bước 2" /><figcaption>2. Nút "Tạo lớp mới"</figcaption></figure>
      <figure><img src="tour-1-dashboard-step3.png" alt="Bước 3" /><figcaption>3. Danh sách lớp</figcaption></figure>
    </div>
  </div>

  <div class="card">
    <h2>Tour Danh sách &amp; nhóm (5 bước)</h2>
    <div class="grid">
      <figure><img src="tour-2-roster-step1.png" alt="Bước 1" /><figcaption>1. Khung "Danh sách học sinh"</figcaption></figure>
      <figure><img src="tour-2-roster-step2.png" alt="Bước 2" /><figcaption>2. Cột "Nhóm cố định"</figcaption></figure>
      <figure><img src="tour-2-roster-step3.png" alt="Bước 3" /><figcaption>3. Nút gán nhóm trưởng</figcaption></figure>
      <figure><img src="tour-2-roster-step4.png" alt="Bước 4" /><figcaption>4. Chọn nhiều học sinh</figcaption></figure>
      <figure><img src="tour-2-roster-step5.png" alt="Bước 5" /><figcaption>5. Thanh tabs — bước tiếp theo</figcaption></figure>
    </div>
  </div>

  <div class="card">
    <h2>Tour màn chiếu PowerPoint (4 cảnh)</h2>
    <div class="grid">
      <figure><img src="tour-3-presentation-edge.png" alt="Mép trái" /><figcaption>1. Mép trái — mở bảng điều khiển ẩn</figcaption></figure>
      <figure><img src="tour-3-presentation-drawer.png" alt="Timer" /><figcaption>2. Drawer — chỉnh thời gian (QR trên header)</figcaption></figure>
      <figure><img src="tour-3-presentation-all-sessions.png" alt="Tất cả phiên" /><figcaption>3. Tất cả phiên</figcaption></figure>
      <figure><img src="tour-3-presentation-create-session.png" alt="Tạo phiên mới" /><figcaption>4. Tạo phiên mới</figcaption></figure>
    </div>
  </div>
</body>
</html>
